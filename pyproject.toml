[project]
name = "layouts-cvm"
description = "Build, validate and serialise the files a fund sends to CVM, in CVM's own file layouts."
dynamic = [
    "version", "readme", "license", "authors", "keywords", "urls", "requires-python",
    "dependencies",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: MIT License",
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries",
]

[tool.poetry]
name = "layouts-cvm"
version = "0.0.0"  # set from the git tag, see docs/contributing.md#releasing
authors = ["guilhermegor"]
readme = "README.md"
license = "MIT"
homepage = "https://guilhermegor.github.io/layouts-cvm/"
documentation = "https://guilhermegor.github.io/layouts-cvm/"
repository = "https://github.com/guilhermegor/layouts-cvm"
keywords = ["layouts-cvm", "python", "library"]
packages = [{ include = "layouts_cvm", from = "src" }]
exclude = ["src/**/CLAUDE.md", "src/**/AGENTS.md"]
package-mode = true

[tool.poetry.urls]
"Bug Reports" = "https://github.com/guilhermegor/layouts-cvm/issues"
"Source" = "https://github.com/guilhermegor/layouts-cvm"
"Documentation" = "https://guilhermegor.github.io/layouts-cvm/"

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
beartype = ">=0.22"
pandas = ">=2.1.0"
numpy = ">=1.22"
openpyxl = ">=3.1.0"
defusedxml = ">=0.7"
pydantic = ">=2.0"

[tool.poetry.group.dev.dependencies]
poethepoet = ">=0.35"
pre-commit = ">=4.1.0"
pretty-errors = ">=1.2.25"
commitizen = ">=4.4.1"
build = ">=1.2.2"
twine = ">=6.1.0"
ruff = ">=0.11.13,<0.12"
codespell = ">=2.4.1"
pydocstyle = ">=6.3.0"
pytest = ">=8.0.0"
pytest-cov = ">=6.0.0"
pytest-randomly = ">=3.15.0"
coverage = ">=7.6.0"
genbadge = {extras = ["coverage"], version = ">=1.1.0"}
mypy = ">=1.8.0"
sqlfluff = ">=3.0.0"
yamllint = ">=1.35.0"
shfmt-py = ">=3.7.0"
shellcheck-py = ">=0.10.0"
deptry = ">=0.20"
pyyaml = "^6.0.3"

[tool.poetry.group.docs.dependencies]
mkdocs = ">=1.6.0"
mkdocs-material = ">=9.5.0"
pymdown-extensions = ">=10.0"
mike = ">=2.1.0"

[tool.deptry.per_rule_ignores]
DEP002 = ["openpyxl"]

[tool.poetry-dynamic-versioning]
enable = true
vcs = "git"
style = "pep440"

[build-system]
requires = ["poetry-core>=2.0.0", "poetry-dynamic-versioning>=1.4.0,<2.0.0"]
build-backend = "poetry_dynamic_versioning.backend"
